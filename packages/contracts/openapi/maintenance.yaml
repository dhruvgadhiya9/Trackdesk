# Planned maintenance module — SCAFFOLD (Sprint 2). PRD: docs/prd/08-pm-schedules.md
tags:
  - name: Maintenance
    description: Planned-maintenance schedules (BS 5839 / BS 5266 intervals).
paths:
  /v1/maintenance-schedules:
    get:
      tags: [Maintenance]
      operationId: listMaintenanceSchedules
      x-roles: [company_owner, ops_manager, customer]
      x-permission: maintenance:read
      x-status: scaffold
      parameters:
        - { name: siteId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/MaintenanceSchedule' } } } } }
        '501': { $ref: '#/components/responses/NotImplemented' }
    post:
      tags: [Maintenance]
      operationId: createMaintenanceSchedule
      x-roles: [company_owner, ops_manager]
      x-permission: maintenance:write
      x-status: scaffold
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateMaintenanceScheduleRequest' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/MaintenanceSchedule' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '501': { $ref: '#/components/responses/NotImplemented' }
components:
  schemas:
    MaintenanceSchedule:
      type: object
      required: [id, siteId, standard, title, intervalMonths, nextDueOn, active]
      properties:
        id: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        standard: { $ref: '#/components/schemas/ComplianceStandard' }
        title: { type: string }
        intervalMonths: { type: integer, format: int32 }
        nextDueOn: { type: string, format: date }
        leadDays: { type: integer, format: int32 }
        slaHours: { type: integer, format: int32 }
        active: { type: boolean }
    CreateMaintenanceScheduleRequest:
      type: object
      required: [siteId, standard, title, nextDueOn]
      properties:
        siteId: { type: string, format: uuid }
        standard: { $ref: '#/components/schemas/ComplianceStandard' }
        title: { type: string, maxLength: 200 }
        intervalMonths: { type: integer, format: int32, minimum: 1, maximum: 60 }
        nextDueOn: { type: string, format: date }
        leadDays: { type: integer, format: int32, minimum: 0, maximum: 90 }
        slaHours: { type: integer, format: int32, minimum: 1 }
