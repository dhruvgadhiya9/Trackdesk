# Assets module — SCAFFOLD (Sprint 1). PRD: docs/prd/03-assets.md
tags:
  - name: Assets
    description: BS 5839 / BS 5266 equipment at sites.
paths:
  /v1/assets:
    get:
      tags: [Assets]
      operationId: listAssets
      x-roles: [company_owner, ops_manager, field_worker, customer]
      x-permission: assets:read
      x-status: scaffold
      parameters:
        - { name: siteId, in: query, required: false, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AssetPage' } } } }
        '501': { $ref: '#/components/responses/NotImplemented' }
    post:
      tags: [Assets]
      operationId: createAsset
      x-roles: [company_owner, ops_manager]
      x-permission: assets:write
      x-status: scaffold
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateAssetRequest' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Asset' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '501': { $ref: '#/components/responses/NotImplemented' }
  /v1/assets/{assetId}:
    get:
      tags: [Assets]
      operationId: getAsset
      x-roles: [company_owner, ops_manager, field_worker, customer]
      x-permission: assets:read
      x-status: scaffold
      parameters:
        - { name: assetId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Asset' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '501': { $ref: '#/components/responses/NotImplemented' }
components:
  schemas:
    AssetType:
      type: string
      enum: [fire_alarm_panel, smoke_detector, heat_detector, call_point, sounder, beacon, emergency_light, exit_sign, central_battery, other]
    Asset:
      type: object
      required: [id, siteId, assetType, standard, status]
      properties:
        id: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        assetType: { $ref: '#/components/schemas/AssetType' }
        standard: { $ref: '#/components/schemas/ComplianceStandard' }
        manufacturer: { type: string }
        model: { type: string }
        serialNumber: { type: string }
        locationDescription: { type: string }
        location: { $ref: '#/components/schemas/GeoPoint' }
        installedOn: { type: string, format: date }
        status: { type: string, enum: [active, decommissioned] }
    AssetPage:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Asset' } }
        page: { $ref: '#/components/schemas/PageMeta' }
    CreateAssetRequest:
      type: object
      required: [siteId, assetType]
      properties:
        siteId: { type: string, format: uuid }
        assetType: { $ref: '#/components/schemas/AssetType' }
        manufacturer: { type: string, maxLength: 100 }
        model: { type: string, maxLength: 100 }
        serialNumber: { type: string, maxLength: 100 }
        locationDescription: { type: string, maxLength: 500 }
        location: { $ref: '#/components/schemas/GeoPoint' }
        installedOn: { type: string, format: date }
