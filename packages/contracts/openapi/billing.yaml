# Quotes, invoices, payments — SCAFFOLD (Sprint 6). PRDs: 18-quotes, 19-invoices, 20-payments
# SECURITY-REVIEW-REQUIRED: payment flow sign-off is human-only.
tags:
  - name: Quotes
    description: Quotes with UK VAT.
  - name: Invoices
    description: Invoices from verified jobs.
  - name: Payments
    description: Payment links and provider webhooks.
paths:
  /v1/quotes:
    get:
      tags: [Quotes]
      operationId: listQuotes
      x-roles: [company_owner, ops_manager, customer]
      x-permission: quotes:read
      x-status: scaffold
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/QuotePage' } } } }
        '501': { $ref: '#/components/responses/NotImplemented' }
    post:
      tags: [Quotes]
      operationId: createQuote
      x-roles: [company_owner, ops_manager]
      x-permission: quotes:write
      x-status: scaffold
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateQuoteRequest' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Quote' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '501': { $ref: '#/components/responses/NotImplemented' }
  /v1/quotes/{quoteId}/accept:
    post:
      tags: [Quotes]
      operationId: acceptQuote
      x-roles: [customer, company_owner, ops_manager]
      x-permission: quotes:accept
      x-status: scaffold
      parameters:
        - { name: quoteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/Quote' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '501': { $ref: '#/components/responses/NotImplemented' }
  /v1/invoices:
    get:
      tags: [Invoices]
      operationId: listInvoices
      x-roles: [company_owner, ops_manager, customer]
      x-permission: invoices:read
      x-status: scaffold
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/InvoicePage' } } } }
        '501': { $ref: '#/components/responses/NotImplemented' }
    post:
      tags: [Invoices]
      operationId: createInvoiceFromJob
      x-roles: [company_owner, ops_manager]
      x-permission: invoices:write
      x-status: scaffold
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateInvoiceRequest' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Invoice' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '501': { $ref: '#/components/responses/NotImplemented' }
  /v1/invoices/{invoiceId}/pay-link:
    post:
      tags: [Payments]
      operationId: createPayLink
      x-roles: [company_owner, ops_manager, customer]
      x-permission: payments:collect
      x-status: scaffold
      parameters:
        - { name: invoiceId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/PayLink' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '501': { $ref: '#/components/responses/NotImplemented' }
  /v1/webhooks/{provider}:
    post:
      tags: [Payments]
      operationId: receivePaymentWebhook
      summary: Provider webhook (signature-verified, idempotent). Not JWT-authenticated.
      security: []
      x-roles: [public-signed-webhook]
      x-permission: none
      x-status: scaffold
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [stripe, mor] } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: true } } }
      responses:
        '200': { description: Processed or already processed }
        '400': { description: Invalid signature }
        '501': { $ref: '#/components/responses/NotImplemented' }
components:
  schemas:
    Money:
      type: string
      pattern: '^-?\d{1,10}\.\d{2}$'
      description: GBP decimal string with exactly 2 dp (never floating point).
      example: '118.00'
    LineItem:
      type: object
      required: [description, quantity, unitPrice, vatRate]
      properties:
        description: { type: string, maxLength: 500 }
        quantity: { type: string, pattern: '^\d{1,6}(\.\d{1,2})?$' }
        unitPrice: { $ref: '#/components/schemas/Money' }
        vatRate: { type: string, enum: ['0.20', '0.05', '0.00'] }
        lineTotal: { $ref: '#/components/schemas/Money' }
    Quote:
      type: object
      required: [id, reference, customerId, status, lines, subtotal, vatTotal, total]
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        customerId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        status: { type: string, enum: [draft, sent, accepted, declined, expired] }
        validUntil: { type: string, format: date }
        lines: { type: array, items: { $ref: '#/components/schemas/LineItem' } }
        subtotal: { $ref: '#/components/schemas/Money' }
        vatTotal: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }
    QuotePage:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Quote' } }
        page: { $ref: '#/components/schemas/PageMeta' }
    CreateQuoteRequest:
      type: object
      required: [customerId, lines]
      properties:
        customerId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        validUntil: { type: string, format: date }
        lines: { type: array, minItems: 1, items: { $ref: '#/components/schemas/LineItem' } }
    Invoice:
      type: object
      required: [id, reference, customerId, status, subtotal, vatTotal, total, amountPaid]
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        customerId: { type: string, format: uuid }
        jobId: { type: string, format: uuid }
        status: { type: string, enum: [draft, issued, paid, overdue, void] }
        issuedOn: { type: string, format: date }
        dueOn: { type: string, format: date }
        lines: { type: array, items: { $ref: '#/components/schemas/LineItem' } }
        subtotal: { $ref: '#/components/schemas/Money' }
        vatTotal: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }
        amountPaid: { $ref: '#/components/schemas/Money' }
    InvoicePage:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Invoice' } }
        page: { $ref: '#/components/schemas/PageMeta' }
    CreateInvoiceRequest:
      type: object
      required: [jobId]
      properties:
        jobId: { type: string, format: uuid }
        dueInDays: { type: integer, format: int32, minimum: 0, maximum: 120 }
        lines: { type: array, items: { $ref: '#/components/schemas/LineItem' } }
    PayLink:
      type: object
      required: [url, expiresAt]
      properties:
        url: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
