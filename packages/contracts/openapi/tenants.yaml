# Tenants module — company sign-up and profile. PRD: docs/prd/00-tenant-onboarding.md
tags:
  - name: Tenants
    description: Company (tenant) onboarding and profile.
paths:
  /v1/tenants:
    post:
      tags: [Tenants]
      operationId: createTenant
      summary: Create a company for the signed-in user (who must not belong to one yet).
      x-roles: [authenticated-without-tenant]
      x-permission: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTenantRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/tenants/current:
    get:
      tags: [Tenants]
      operationId: getCurrentTenant
      summary: The caller's company.
      x-roles: [company_owner, ops_manager, field_worker, customer]
      x-permission: tenant:read
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  schemas:
    CreateTenantRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 200 }
        fullName: { type: string, maxLength: 200, description: Owner's display name. }
    Tenant:
      type: object
      required: [id, name, slug, countryCode, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        countryCode: { type: string, example: GB }
        status: { type: string, enum: [active, suspended] }
        createdAt: { type: string, format: date-time }
