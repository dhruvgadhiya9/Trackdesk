      type: object
      required:
        - customerId
        - siteId
        - title
      properties:
        customerId:
          type: string
          format: uuid
        siteId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 4000
        priority:
          $ref: "#/components/schemas/JobPriority"
        assetIds:
          type: array
          items:
            type: string
            format: uuid
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
    Search:
      name: search
      in: query
      required: false
      schema:
        type: string
        maxLength: 100
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-generated key; replays return the original response (offline sync).
      schema:
        type: string
        maxLength: 100
  responses:
    BadRequest:
      description: Validation failed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Missing or invalid token.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Role lacks permission.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Not found (also returned for other tenants' resources).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Conflict (optimistic lock, invalid state transition, duplicate).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotImplemented:
      description: Scaffolded endpoint, not implemented yet.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
tags:
  - name: Assets
    description: BS 5839 / BS 5266 equipment at sites.
  - name: Quotes
    description: Quotes with UK VAT.
  - name: Invoices
    description: Invoices from verified jobs.
  - name: Payments
    description: Payment links and provider webhooks.
  - name: Compliance
    description: BS 5839 / BS 5266 certificates and records (immutable, versioned).
  - name: Customers
    description: Organisations the contractor services.
  - name: Dispatch
    description: Dispatch board, technician availability and assignment.
  - name: Fieldwork
    description: Field execution, checklists, media, consent, location and offline sync.
  - name: Jobs
    description: Jobs and the job lifecycle state machine.
  - name: Maintenance
    description: Planned-maintenance schedules (BS 5839 / BS 5266 intervals).
  - name: Platform
    description: Feature flags and platform utilities.
  - name: Portal
    description: Customer portal (customer role only sees own records).
  - name: Reporting
    description: Tenant-scoped operational reports.
  - name: Chat
    description: Chat history and moderation (live delivery via Supabase Realtime).
  - name: Sites
    description: Customer sites with PostGIS location.
  - name: Teams
    description: Teams, technician skills and working hours.
  - name: Tenants
    description: Company (tenant) onboarding and profile.
  - name: Users
    description: Users, roles and invitations.
  - name: Verification
    description: Happy Code job verification.
  - name: WorkOrders
    description: Work orders linking customer, site and assets.
