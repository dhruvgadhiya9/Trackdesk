        - title
        - status
        - assetIds
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
        customerId:
          type: string
          format: uuid
        siteId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        priority:
          $ref: "#/components/schemas/JobPriority"
        status:
          type: string
          enum:
            - open
            - in_progress
            - completed
            - cancelled
