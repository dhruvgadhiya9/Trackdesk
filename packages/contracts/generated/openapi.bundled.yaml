components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth access token.
  schemas:
    AssetType:
      type: string
      enum:
        - fire_alarm_panel
        - smoke_detector
        - heat_detector
        - call_point
        - sounder
        - beacon
        - emergency_light
        - exit_sign
        - central_battery
        - other
    Asset:
      type: object
      required:
        - id
        - siteId
        - assetType
        - standard
        - status
      properties:
        id:
          type: string
          format: uuid
        siteId:
          type: string
          format: uuid
        assetType:
          $ref: "#/components/schemas/AssetType"
        standard:
          $ref: "#/components/schemas/ComplianceStandard"
        manufacturer:
          type: string
        model:
          type: string
        serialNumber:
          type: string
        locationDescription:
          type: string
        location:
          $ref: "#/components/schemas/GeoPoint"
        installedOn:
          type: string
          format: date
        status:
          type: string
          enum:
            - active
            - decommissioned
    AssetPage:
      type: object
      required:
        - items
        - page
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Asset"
        page:
          $ref: "#/components/schemas/PageMeta"
    CreateAssetRequest:
      type: object
      required:
        - siteId
        - assetType
      properties:
        siteId:
          type: string
          format: uuid
        assetType:
          $ref: "#/components/schemas/AssetType"
        manufacturer:
          type: string
          maxLength: 100
        model:
          type: string
          maxLength: 100
        serialNumber:
          type: string
          maxLength: 100
        locationDescription:
          type: string
          maxLength: 500
        location:
          $ref: "#/components/schemas/GeoPoint"
        installedOn:
          type: string
          format: date
    Money:
      type: string
      pattern: ^-?\d{1,10}\.\d{2}$
      description: GBP decimal string with exactly 2 dp (never floating point).
      example: "118.00"
    LineItem:
      type: object
      required:
        - description
        - quantity
        - unitPrice
        - vatRate
      properties:
        description:
          type: string
          maxLength: 500
        quantity:
          type: string
          pattern: ^\d{1,6}(\.\d{1,2})?$
        unitPrice:
          $ref: "#/components/schemas/Money"
        vatRate:
          type: string
          enum:
            - "0.20"
            - "0.05"
            - "0.00"
        lineTotal:
          $ref: "#/components/schemas/Money"
    Quote:
      type: object
      required:
        - id
        - reference
        - customerId
        - status
        - lines
        - subtotal
        - vatTotal
        - total
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
        customerId:
          type: string
          format: uuid
        siteId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - draft
            - sent
            - accepted
            - declined
            - expired
        validUntil:
          type: string
          format: date
        lines:
          type: array
          items:
            $ref: "#/components/schemas/LineItem"
        subtotal:
          $ref: "#/components/schemas/Money"
        vatTotal:
          $ref: "#/components/schemas/Money"
        total:
          $ref: "#/components/schemas/Money"
    QuotePage:
      type: object
      required:
        - items
        - page
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Quote"
        page:
          $ref: "#/components/schemas/PageMeta"
    CreateQuoteRequest:
      type: object
      required:
        - customerId
        - lines
      properties:
        customerId:
          type: string
          format: uuid
        siteId:
          type: string
          format: uuid
        validUntil:
          type: string
          format: date
        lines:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/LineItem"
    Invoice:
      type: object
      required:
        - id
        - reference
        - customerId
        - status
        - subtotal
        - vatTotal
        - total
        - amountPaid
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
        customerId:
          type: string
          format: uuid
        jobId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - draft
            - issued
            - paid
            - overdue
            - void
        issuedOn:
          type: string
          format: date
        dueOn:
          type: string
          format: date
        lines:
          type: array
          items:
            $ref: "#/components/schemas/LineItem"
        subtotal:
          $ref: "#/components/schemas/Money"
        vatTotal:
          $ref: "#/components/schemas/Money"
        total:
          $ref: "#/components/schemas/Money"
        amountPaid:
          $ref: "#/components/schemas/Money"
    InvoicePage:
      type: object
      required:
        - items
        - page
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Invoice"
        page:
          $ref: "#/components/schemas/PageMeta"
    CreateInvoiceRequest:
      type: object
      required:
        - jobId
      properties:
        jobId:
          type: string
          format: uuid
        dueInDays:
          type: integer
          format: int32
          minimum: 0
          maximum: 120
        lines:
          type: array
          items:
            $ref: "#/components/schemas/LineItem"
    PayLink:
      type: object
      required:
        - url
        - expiresAt
      properties:
        url:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
    Problem:
      type: object
      description: RFC 9457 Problem Details.
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          example: https://trackdesk.app/problems/validation
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Stable machine-readable error code.
        requestId:
          type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
        message:
          type: string
    PageMeta:
      type: object
      required:
        - page
        - size
        - totalElements
        - totalPages
      properties:
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    Role:
      type: string
      enum:
        - company_owner
        - ops_manager
        - portal_owner
        - customer
        - field_worker
    Address:
      type: object
      properties:
        line1:
          type: string
          maxLength: 200
        line2:
          type: string
          maxLength: 200
        city:
          type: string
          maxLength: 100
        postcode:
          type: string
          maxLength: 10
    GeoPoint:
      type: object
      required:
        - latitude
        - longitude
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
    ComplianceStandard:
      type: string
      enum:
        - BS5839
        - BS5266
        - OTHER
    Certificate:
      type: object
      required:
        - id
        - jobId
        - siteId
        - standard
        - certificateType
        - version
        - status
      properties:
        id:
          type: string
          format: uuid
        jobId:
          type: string
          format: uuid
        siteId:
          type: string
          format: uuid
        standard:
          $ref: "#/components/schemas/ComplianceStandard"
        certificateType:
          type: string
          enum:
            - inspection_servicing
            - periodic_test
            - commissioning
            - modification
        version:
          type: integer
          format: int32
        supersedesId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - draft
            - issued
            - superseded
        issuedAt:
          type: string
          format: date-time
        contentSha256:
          type: string
    CertificatePage:
      type: object
      required:
        - items
        - page
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Certificate"
        page:
