# Defaults shared by every profile. Secrets come ONLY from environment variables / secret manager.
spring:
  application:
    name: trackdesk-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:54422/postgres}
    # The API role: not superuser, not table owner, no BYPASSRLS (DECISIONS D-006).
    username: ${DB_APP_USER:trackdesk_app}
    password: ${DB_APP_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 5000
  flyway:
    # Migrations run as the owner role (owns tables, still subject to FORCE RLS).
    user: ${DB_OWNER_USER:trackdesk_owner}
    password: ${DB_OWNER_PASSWORD:}
    locations: classpath:db/migration
    baseline-on-migrate: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mvc:
    problemdetails:
      enabled: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  shutdown: graceful
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: trackdesk-api

trackdesk:
  web-base-url: ${WEB_BASE_URL:http://localhost:3000}
  security:
    jwk-set-uri: ${SUPABASE_JWKS_URL:}
    issuer: ${SUPABASE_JWT_ISSUER:}
    audience: authenticated
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
  auth-admin:
    provider: ${AUTH_ADMIN_PROVIDER:fake}
    supabase-url: ${SUPABASE_URL:}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
  payments:
    provider: ${PAYMENTS_PROVIDER:fake}
  maps:
    provider: ${MAPS_PROVIDER:fake}
  sms:
    provider: ${SMS_PROVIDER:fake}

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  send-default-pii: false
  traces-sample-rate: 0.0
